# Alembic configuration — SportAble Melbourne
#
# Owned by the Infra/Platform engineer: this file, migrations/env.py and
# migrations/script.py.mako are pipeline plumbing.
# Owned by the Backend engineers: every revision in migrations/versions/.
#
# sqlalchemy.url is deliberately absent. env.py resolves the URL at runtime
# from SSM Parameter Store (deployed) or DATABASE_URL (local). A connection
# string must never appear in this file.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
