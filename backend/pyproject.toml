[project]
name = "sportable-backend"
version = "0.1.0"
description = "SportAble Melbourne — FastAPI service on AWS Lambda"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "mangum>=0.19",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "aws-lambda-powertools[tracer]>=3.0",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.7",
    "mypy>=1.13",
    "uvicorn[standard]>=0.52.4",
]

# Ruff configuration lives in the repository root (../ruff.toml) so that
# backend/ and data/ are linted identically. Do not add [tool.ruff] here — the
# nearest config wins, and a section here would silently override the shared one
# for this package only.

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# backend/ so tests can import `handlers.stub` and `app`; backend/handlers/ so
# that `import fixtures` resolves exactly as it does inside the Lambda, where
# archive_file flattens the directory and every module sits at the zip root.
# Without the second entry, code that works when deployed fails under pytest.
pythonpath = [".", "handlers"]
addopts = "--cov=app --cov=handlers --cov-report=term-missing"
markers = ["integration: requires a live PostGIS container"]
