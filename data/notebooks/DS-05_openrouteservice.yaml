known_limitations:
  - >-
    A route returned by the wheelchair profile is not a verified accessible route. Under no option does any screen describe the route as accessible.
    AC2.3.4 requires the interface to state what the profile does and does not verify, and that sentence must be built from the profile's actual
    restriction parameters, not from a plausible-sounding description.
  - >-
    Routing is computed over OpenStreetMap. OpenStreetMap therefore enters the product as infrastructure even though no PBF extract is ingested and no OpenStreetMap source card
    exists in the register. The Sources and licences view names OpenStreetMap contributors on that basis. No facility status traces to OSM; government
    records remain the only thing that can produce a confirmed.
  - >-
    The provider disclaims accuracy, completeness and reproducibility of routing results, and states OpenStreetMap should not be relied upon where omissions
    or errors could result in injury. For a product serving wheelchair users this disclaimer is directly relevant and belongs in the known-limitation
    register that generates the venue card's limits section.
  - >-
    The provider's terms prohibit transmitting personal data. The journey starting point is often a home address, and combined with the selected
    access filters it can support an inference about a person's disability, which is sensitive information under the Privacy Act 1988 (Cth). This is the
    one point in the request path where that value leaves our account. Resolved: see decision DS-05-D1. Coordinates only, nothing collected, nothing
    stored, nothing logged, disclosed before use. The residual risk recorded there stays on the register rather than being treated as closed.
  - >-
    Exceeding the request rate returns an error, and repeated excess results in temporary blocking or account removal without notice. One account per person
    across all HeiGIT services. A rate-limit failure is not a transient error to retry; the directions view degrades to the corridor list with a stated
    reason, per the existing fallback.
  - >-
    Latency sits inside the three-second budget of AC1.1.5 and is not under our control. If the call fails or exceeds budget the view degrades honestly
    rather than erroring or moving the budget.
  - >-
    Terms may change at any time by posting, effective immediately. Re-read before submission and record the date read in verification.method, because
    there is no published version or revision date to cite.

decisions:
  - id: DS-05-D1
    title: Transmission of the journey starting point
    status: resolved
    decided_on: 2026-09-02
    decided_by: Industry mentor, on the recommendation of the data engineering lead
    question: >-
      The provider prohibits transmitting personal data. A journey starting point may be a home address, and combined with the selected access filters it
      can support an inference about a person's disability, which is sensitive information under section 6 of the Privacy Act 1988 (Cth). Routing cannot be
      offered without sending an origin somewhere.
    decision: >-
      Offer the directions feature. Send only a coordinate pair, never a typed address string, and never any identifier alongside it. Collect nothing,
      store nothing, log nothing.
    reasoning: >-
      The product cannot route a person without knowing where they are starting from, and the feature is the one that most directly serves the purpose of
      the project: a person deciding whether a trip is possible before leaving. Refusing to build it would protect a privacy interest by removing the
      benefit the person came for.
      What makes the transmission defensible is that nothing about it is retained or attributable. We do not ask who the person is, we do not hold an
      account, we do not know whether the origin is a home, a workplace, a hotel or a footpath, and we have no way of finding out. The coordinate arrives,
      is used for the length of one request, and is gone. There is no record on our side to subpoena, breach or correlate, and nothing that could later be
      joined to anything else.
      This is a deliberate design position rather than an absence of thought: the same feature built with accounts, saved addresses or a route history
      would be a materially different privacy proposition and would require a different answer.
    controls:
      - >-
        Coordinates only. The typed suburb or postcode is resolved internally against the search_location gazetteer; the string the person typed is never
        forwarded to the provider.
      - >-
        No persistence. Route geometry, origin and destination are held for the length of the request and never written to the database, to object storage
        or to application logs. This is enforced by the corridor functions taking the geometry as an argument and returning rows, with no insert path.
      - >-
        No identifiers. No account, no cookie, no session token and no client identifier accompanies the request to the provider.
      - >-
        No origin in access logs. The origin is sent in a POST body, never a query string, so it cannot appear in web server logs, referrer headers or
        browser history.
      - >-
        Disclosure before use. The directions page states, before the person supplies a starting point, that the coordinate is sent to openrouteservice to
        compute the path and is not stored by SportAble. AC2.2.1 already requires the starting point to be requested explicitly, so there is no default
        origin and no silent transmission.
      - >-
        The person may instead choose a suburb or postcode as the starting point, which resolves to the gazetteer reference point and never approaches a
        street address. Offered as an equal option, not a degraded one.
    residual_risk: >-
      The coordinate is still transmitted to a third party at the moment the person asks for directions, and the provider's own handling is outside our
      control. The controls above reduce what that transmission can reveal and remove any lasting record on our side; they do not make the transmission
      not happen. Recorded here rather than described as eliminated.
    review_trigger: >-
      Revisit if accounts, saved locations, route history, analytics on the directions page, or any server-side caching of routes is proposed. Each of
      those changes the basis of this decision.

