source_id: DS-05
name: openrouteservice
publisher: HeiGIT gGmbH
description: >-
  Routing service used to obtain the street-level path between a user-supplied starting point and a venue, using the wheelchair profile. Infrastructure, not
  evidence: nothing it returns is stored, and no facility status ever traces to it. It is the only third-party call permitted on the request path, because the
  path depends on a starting point supplied at request time and therefore cannot be materialised into the database in advance.

tier: live
cadence: request_time

licence:
  name: Creative Commons Attribution-ShareAlike
  version: 4.0 International
  url: https://creativecommons.org/licenses/by-sa/4.0/
  attribution_text: >-
    Routing by openrouteservice by HeiGIT, data from OpenStreetMap.
  share_alike: true
  restricts_caching: false
  restricts_redistribution: false
  restricts_derived_works: true
  notes: >-
    The provider requires the exact string "(c) openrouteservice by HeiGIT | Data from OpenStreetMap" displayed in the map image or elsewhere in the
    implementation. Render that verbatim wording, not the paraphrase above. Results are licensed CC BY-SA 4.0, a third distinct licence instrument in
    this register alongside CC BY 4.0 and CC BY 3.0 Australia. The share-alike condition attaches to distributed adaptations; Iteration 1 publishes no
    derived database, so it is not triggered by the site itself. Any later decision to publish route-derived or OSM-derived data goes through the
    product owner first, on the same footing as the ODbL position. Nothing in the terms prohibits caching or storing returned geometry. The
    no-persist rule for route geometry is this project's own privacy control, not a licence obligation, and the two should not be conflated when explaining it.

retrieval:
  landing_page: https://openrouteservice.org/terms-of-service/
  download_url: https://api.openrouteservice.org/v2/directions/wheelchair/geojson
  format: api
  raw_prefix: openrouteservice
  requires_auth: true
  notes: >-
    ORS Core 9.10.0. API key passed in the Authorization header for POST, never in a query parameter, so it does not appear in access logs or referrer
    headers. The geojson variant returns a LineString directly, which is what the corridor derivation consumes. The returned geometry is declared as EPSG:7844
    rather than transformed from EPSG:4326: the two differ by roughly 1.8 m at Melbourne latitudes, ST_Transform between them needs grid files absent
    from RDS, and 1.8 m cannot change membership of a 400 m corridor. Selection uses ST_DWithin on a geography cast against the GiST index on
    amenity.geom, ordered by ST_LineLocatePoint along the line. No projection step and no format conversion step. See sql/006_route_corridor.sql.
    The bundled Pelias geocoding endpoints are deliberately not used. Reference points come from the search_location gazetteer built from DS-07 suburbs and DS-08 postal areas, which is deterministic and
    internal; a second geocoder would create two sources of truth for the same question.

coverage:
  publisher_scope: continental
  records_total: null
  records_in_target_area: null
  basis: >-
    NOT APPLICABLE. A routing service returns computed paths, not records. It contributes no rows to the canonical model and has no coverage figure to
    report. These fields stay null and the coverage gate check should be waived for live-tier sources rather than satisfied with a fabricated number.
  notes: null

