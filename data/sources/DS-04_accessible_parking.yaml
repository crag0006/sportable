known_limitations:
  - >-
    The publisher states that disability parking locations shown on this map are currently subject to upgrade works under its Parking and Kerbside
    Management Plan. This is the council's own currency caveat and is carried through to the venue card rather than paraphrased away. A point on this layer
    is where the council recorded a bay, not a guarantee that the bay is there today.
  - >-
    The layer publishes no last-updated value of any kind and the council states only that locations are subject to upgrade works. The retrieval date
    stands in for the publisher date, and the venue card says the date the data was retrieved rather than the date it was published, because those are
    different claims and only one of them can be made honestly here.
  - >-
    The layer publishes no identifier. The id attribute is null on every feature, so there is no natural key, no stable reference for an individual bay and
    no publisher-side change detection between fetches. A synthetic key is derived on load by hashing the rounded coordinate together with the Name value.
    That key is deterministic and rebuildable from raw, but it is derived rather than published, and it changes if the publisher moves a point by more than
    the rounding tolerance.
  - >-
    Bays are closely spaced. The median nearest-neighbour distance is 8.06 metres, 455 points sit within 20 metres of another point and two sit within one
    metre. These are counted as separate bays because the publisher lists them separately and a street segment genuinely carries several. The record count
    is therefore a count of published points, not a surveyed count of physical spaces, and it is reported that way in the quality report.
  - >-
    A point is a bay, not a route to a bay. It records where the council marked a space, not the kerb ramp, the crossing, the gradient or the path from the
    bay to a venue entrance. Proximity between a bay and a venue is a measured straight-line distance and the interface must not imply a step-free route.
  - >-
    An on-street bay is not venue parking. Off-street accessible parking at a venue is recorded by DS-01 in Facility Features. The two must not be merged
    into a single status without preserving which source said what; is_inside_venue is false for every row from this source.
  - >-
    Coverage is one local government area of 31. Accessible on-street parking is reported as no published information for the other 30, and that shortfall
    is a coverage figure for the quality report, never a gap to be filled from another source.
  - >-
    The publisher's own value for the usage attribute is spelled "Disable Parking". It is retained verbatim in the raw zone and normalised downstream. A
    publisher's value is never silently corrected in place.
  - >-
    The description attribute duplicates the parsed fields as a concatenated text blob and carries a byte-order mark. It is ignored on load in favour of the
    parsed columns, and no attribute is inferred from it.
  - >-
    This source replaces the City of Melbourne on-street car park bay restrictions and on-street parking bays datasets, which were registered earlier in
    Iteration 1 and withdrawn on 31 August 2026. Those two files could not be joined: the restrictions file carries the accessible designation but no
    location attribute of any kind, and six candidate routes were tested and all failed, including the publisher's own documented bridge via the parking
    bay sensors. Of the 102 bays the restrictions file designated for disabled parking, 5 resolved to a coordinate. The publisher's dataset pages state
    that the two files do not currently join. That evidence is retained in the retired source cards.

