  notes: >-
    ESRI shapefile in a zip, GDA2020, 38.84 MB. Take GDA2020 rather than GDA94: storage is EPSG:7844, so GDA94 would add a transform and a 1.8 metre offset
    for nothing. Fields are LGA_CODE25, LGA_NAME25, STE_CODE21, STE_NAME21 and AREASQKM. The year suffix on the first two tracks the release year, not 2021,
    and ASGS_LOCI_URI is absent from the 2025 file.

