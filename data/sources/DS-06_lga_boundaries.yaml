known_limitations:
  - >-
    ASGS Local Government Areas are Mesh Block approximations of gazetted local government boundaries, not the gazetted boundaries themselves. The ABS
    states they should not be used for legal purposes. For deciding whether a sport venue falls inside a municipality this is fine; for any claim about a
    legal boundary it is not.
  - >-
    Edition 3 is used because Edition 4, released 22 July 2026, does not yet include Non ABS Structures. LGA and SAL are expected in October 2026. Using
    a reference period that ended in June 2026 is the current published position, not an oversight, and this note is the record of why.
  - >-
    Positional accuracy derives from the Geoscape layers the boundaries are aligned to, plus or minus 2 metres in urban areas. Boundaries are generalised
    to 5 cm with a 7.5 cm shared boundary tolerance. A venue sitting within a few metres of a municipal border could fall either side.
  - >-
    Published 6 October 2021, the Non ABS Structures set updated 22 July 2025, and the LGA 2025 file itself corrected on 21 July 2026 to fix Cocos (Keeling)
    Islands state attributes. publisher_last_updated records the file-level correction date, which is the one that describes the artefact being loaded.
  - >-
    LGA boundaries are revised annually, so the 2025 vintage will be superseded. Record which vintage each build consumed; a venue's LGA is not a permanent fact.

