known_limitations:
  - >-
    Facility Features is the only accessibility-bearing field. 
    'Toilets (Disabled)' maps to accessible_toilet and 'Parking Bay(s) for the disabled' maps to accessible_parking, both with is_inside_venue 
    true because the source records them at the venue. In the City of Melbourne 10 venues record the first and 4 record the second.
  - >-
    Facility Features is populated for 17 of the 52 City of Melbourne venues. Where it is blank, both facility types are no_published_information. 
    Where it is populated but omits a feature, that is also no_published_information, not not_available: 
    the field has not been established as an exhaustive checklist, so an omission is not a recorded absence.
  - >-
    Field/Surface Type records the type of playing surface at the facility. 
    The dataset does not mention whether a particular surface is accessible to or suitable for wheelchair users, 
    so it must not be interpreted as an accessibility indicator or included in the access chain. 
    However, it is retained as a descriptive facility feature, allowing users to filter or choose a sport facility based on their preferred surface type.
  - >-
    Changerooms records Male, Female, Unisex and Umpire/Officials. It carries no accessibility attribute, so accessible change rooms 
    are not derivable from this source.
  - >-
    Records no step-free entry, no accessible entrance location and no path to the playing surface. 
    Two of the five access chain links are absent here and are reported as no published information, never estimated.
  - >-
    Venue coordinates are supplied for some rows and absent for others. Where a point is derived by geocoding the published street address, geom_basis
    records that. For a wheelchair user the difference between a site centroid and an actual entrance can be a hundred metres and a flight of steps, 
    so the venue card states that distances are measured to the venue location as published.
  - >-
    Eight rows statewide fail the Victorian coordinate bounding box: some have a misplaced decimal point and some have latitude and longitude transposed.
    None fall in the City of Melbourne, where all 38 coordinate-bearing venues pass. The bounding box check in the column contract stays regardless, and
    failures are quarantined with a reason code rather than dropped.
  - >-
    Published 17 December 2024. Under the 21-day stale rule for a weekly feed this source is stale on arrival, and every venue row drawn from it carries
    the freshness note. This is expected and is not a defect. An old record of a facility is still a record; it is the confidence that ages, not the fact.
  - >-
    The publisher updates as needed rather than on a schedule. The weekly cadence above is a polling cadence, not a publication cadence. Expect long
    stretches with an unchanged payload hash and a no-change run manifest.

