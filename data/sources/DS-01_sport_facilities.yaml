source_id: DS-01
name: Sport and Recreational Facilities List
publisher: The Department of Jobs, Skills, Industry and Regions (DJSIR)
description: >-
  Statewide Victorian register of sport and recreational facilities giving location, sports played, surface type, condition and recorded facility features.
  This is the venue spine of the product: every venue_id in the canonical model originates here. 
  It also supplies on-site accessible toilet and on-site accessible parking, from the Facility Features field.

tier: reference
cadence: weekly
publication_cadence: as_needed

licence:
  name: Creative Commons Attribution
  version: 4.0 International
  url: https://creativecommons.org/licenses/by/4.0/
  attribution_text: >-
    Sport and Recreational Facilities List, The Department of Jobs, Skills, Industry and Regions (DJSIR), State Government of Victoria, via DataVic.
  share_alike: false
  restricts_caching: false
  restricts_redistribution: false
  restricts_derived_works: false
  notes: >-
    The DataVic page states no required attribution wording, so the string above is generated from the dataset title and publisher. 
    It is rendered from this register into the Sources and licences view, never hand-written into a template, so a dataset swap cannot leave a stale credit behind.

retrieval:
  landing_page: https://discover.data.vic.gov.au/dataset/sport-and-recreational-facilities-list
  download_url: https://discover.data.vic.gov.au/dataset/e6db797e-3801-4cfa-bf02-82350d0f722d/resource/bfff5fff-9c74-4671-8396-43f793613b70/download/srv_ifmd_all-facilities.xlsx
  format: xlsx
  raw_prefix: sport_facilities
  requires_auth: false
  notes: >-
    Four sheets. Read wholeIFMD only; the other three are a publisher-side alphabetised copy, a working count and an empty sheet, and they are not independent data. 
    The Fetch Lambda lands the workbook byte for byte. Sheet selection, header handling and column mapping happen in Transform, never in the raw zone.

coverage:
  publisher_scope: statewide
  snapshot_date: 2024-12-17
  records_total: 9590
  records_in_target_area: 129
  basis: >-
    Counted from sheet wholeIFMD of the 17 December 2024 publication. 
    Filter is LGA Name equal to 'Melbourne City Council'; no other value in the column refers to the City of Melbourne.
  notes: >-
    File grain is one row per facility per sport, not one row per venue. 
    The 129 in-area rows resolve to 52 distinct venues by name and full address, of which 38 carry coordinates. 
    Both figures go in the quality report; the row count is the source record count, the venue count is what reaches the venue table.

verification:
  verified: false
  verified_by: null
  verified_at: null
  method: >-
    Licence, publisher and publisher last-updated read from the Additional Information table on the DataVic dataset page. 
    Coverage counted from the downloaded workbook, SHA-256 d7a3992688ab6f007c736ac0ee89928dc5b0fd7b075d1d9dcda49a854a42dc34.

publisher_last_updated: 2024-12-17

supplies_venues: true
