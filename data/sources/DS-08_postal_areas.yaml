source_id: DS-08
name: ASGS Postal Areas
publisher: Australian Bureau of Statistics
description: >-
  Postal Area boundaries from the Australian Statistical Geography Standard, Edition 3, 2021. One job: resolving a postcode typed into the search box to
  the point that distances are measured from. The search accepts a suburb or a postcode, and DS-07 Suburbs and Localities publishes no postcode field, so
  before this source nothing in the register could turn "3000" into a coordinate. It supplies no facility, no attribute and no status.

