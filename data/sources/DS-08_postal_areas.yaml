known_limitations:
  - >-
    ABS Postal Areas are approximations of Australia Post postcodes built from Mesh Blocks. They are not the postcodes themselves and the ABS states they
    should not be used for mail delivery or for any purpose requiring the actual postcode boundary. Resolving a typed postcode to a search point is well
    within what an approximation supports; any claim about which postcode an address belongs to is not.
  - >-
    Not every Australia Post postcode has a corresponding postal area. Post office box and large-volume-receiver postcodes have no geographic extent and
    are absent from the layer. A user typing one of those gets the not-recognised path rather than the not-covered path, and the wording of the
    not-recognised message has to be broad enough that this is not a lie.
  - >-
    The search point is ST_PointOnSurface of the polygon, not its centroid. A postal area can be crescent-shaped or multipart, and its centroid can fall
    outside it or in a neighbouring suburb. The point is a representative point inside the area, and the interface names it as such rather than implying
    the user's actual position, which AC1.1.3 requires.
  - >-
    A postal area is an area. Every distance measured from it is measured from one representative point inside it, so two venues equidistant from that
    point can be very different distances from where the user actually is. This is stated on screen and is the reason AC1.1.3 exists.
  - >-
    Only a 2021 vintage exists, unlike LGA which is revised annually. The postal area boundaries are therefore five years older than the LGA layer they
    are intersected against, and a boundary that has moved since 2021 will disagree at the margin.

