    groups by instrument, so it must not be lumped in with DS-02.

retrieval:
  landing_page: https://www.abs.gov.au/statistics/standards/australian-statistical-geography-standard-asgs/edition-3-july-2021-june-2026/access-and-downloads/digital-boundary-files
  download_url: https://www.abs.gov.au/statistics/standards/australian-statistical-geography-standard-asgs/edition-3-july-2021-june-2026/access-and-downloads/digital-boundary-files/POA_2021_AUST_GDA2020_SHP.zip
  format: zip
  raw_prefix: postal_areas
  requires_auth: false
  expected_sha256: null
  notes: >-
    ESRI shapefile in a zip, GDA2020. Take GDA2020 rather than GDA94 for the same reason as DS-06 and DS-07: storage is EPSG:7844, so GDA94 would add a
    transform and a 1.8 metre offset for nothing. Fields are POA_CODE21, POA_NAME21, AUS_CODE21, AUS_NAME21 and AREASQKM21. Only a 2021 vintage exists.
    expected_sha256 is null until the first fetch lands and the hash is backfilled, which is the same position DS-01, DS-02, DS-04 and DS-07 are in.

coverage:
  publisher_scope: national
  records_total: null
  records_in_target_area: null
  basis: >-
    PENDING PROFILE. Count POA polygons nationally, then count those intersecting the union of the 31 Greater Melbourne councils from DS-06. Take the
    counts from the file rather than from the publisher's summary.
  notes: >-
    Postal areas outside Greater Melbourne are loaded rather than clipped. AC1.1.4 requires a recognised location outside the covered area to be told
    apart from a location that was not recognised at all, and that distinction cannot be made from a table that only holds the covered area. The
    in_greater_melbourne flag on the search_location read model carries the separation instead.

