source_id: DS-07
name: ASGS Suburbs and Localities
publisher: Australian Bureau of Statistics
description: >-
  Suburb and locality boundaries from the Australian Statistical Geography Standard, Edition 3, 2021. Backs the reference-point resolver: a typed suburb
  name resolves to a boundary polygon and a representative point, which is what lets a measured distance be displayed with a truthful statement of where it
  was measured from.

