known_limitations:
  - >-
    Suburbs and Localities are Mesh Block approximations of officially recognised suburb boundaries as defined by state and territory governments,
    not the official boundaries. The ABS states approximations do not match official legal boundaries and should be used for statistical purposes only.
  - >-
    The representative point for a locality must be the pole of inaccessibility of the polygon, not the mathematical centroid. The centroid of a river-split
    or crescent-shaped locality can fall outside the locality itself, which would make every distance measured from it wrong while looking correct.
  - >-
    A distance measured from a locality centre is not a distance from the user. The resolver returns the display string that says so, and the interface
    cannot render a distance without it.
  - >-
    Suburb names are not unique across Victoria. Where a typed name matches more than one locality, all candidates are returned for the user to choose, never
    one picked silently.
  - >-
    Postcodes are a different geography from suburbs and are not in this file. If postcode search is in scope, ASGS Postal Areas is a separate download and
    a separate registered source.
  - >-
    Updated every five years, last in 2021, next expected October 2026 as part of Edition 4. Under the 90-day stale rule this layer is long stale, but a
    boundary that has not moved is not a stale fact. Boundary layers are static reference data and the stale flag does not apply to them.

