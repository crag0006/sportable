coverage:
  publisher_scope: national
  records_total: null
  records_in_target_area: null
  basis: >-
    PENDING PROFILE. The publisher states 15353 Suburbs and Localities covering Australia, including 19 non-spatial special purpose codes. Count from the
    file rather than taking that figure, then count those with STE_CODE21 equal to 2 for Victoria, or those falling inside the DS-07 City of Melbourne
    polygon under the narrower scope.
  notes: >-
    The 19 special purpose codes, including an Outside Australia code, are not real localities and must be excluded before the gazetteer is built.

