known_limitations:
  - >-
    An accessible toilet flag records that a facility is designated accessible. It records nothing about door width, circulation space or whether the
    approach to the facility is step free.
  - >-
    Every accessibility field in this export is a two-valued boolean with no null state. There are no missing values anywhere in Accessible, MLAK24 or
    AdultChange. A false therefore cannot be distinguished from an unticked box on the data alone. See the blocking open question below; this decides
    whether 67 City of Melbourne facilities are displayed as a recorded absence or as no published information.
  - >-
    KeyRequired and MLAK24 are internally inconsistent. In the provisional City of Melbourne set, 31 facilities are marked MLAK24 true while KeyRequired is
    false, and nationally the figure is 632 against only 4 marked both. A MLAK facility is by definition locked, so MLAK24 must drive mlak_required and
    KeyRequired cannot be relied on. A toilet requiring MLAK is unusable to somebody without a key, so this field must never default to false.
  - >-
    OpeningHours is fully populated in the provisional City of Melbourne set, with values such as 24 hours, daylight hours, variable hours, venue hours
    and currently closed. Variable hours and venue hours are not machine readable and must be rendered as recorded text with hours_recorded true,
    never parsed into an open or closed state.
  - >-
    The publisher states a reference period ending 12 January 2022. Under the 21-day stale rule for a weekly feed, every row from this source is stale on
    arrival and carries the freshness note. An old record of a toilet is still a record; it is the confidence that ages, not the fact.
  - >-
    The export carries AdultChange, ChangingPlaces, ACShower and BYOSling, which in the provisional City of Melbourne set are true for 30, 20, and fewer
    facilities respectively. These are the only published source of Changing Places data available to the project. accessible_change was removed from
    Iteration 1 scope, so these fields are read but not loaded. This is a scope decision, not a data gap, and it is recorded here so it can be reversed
    cheaply in a later iteration.
  - >-
    Facilities in this source are nearby public amenities, not venue amenities. is_inside_venue is set true only where a source explicitly records the
    facility as being at the venue, and this source does not, so rows from here resolve to unknown unless corroborated by the DS-01 Facility Features field.

open_questions:
  - >-
    BLOCKING. Establish whether a false in Accessible is a recorded absence or an unticked field. The National Public Toilet Map is maintained by facility
    operators through a submission form, and a boolean with no null state cannot express the difference. If false is a recorded absence, 67 City of Melbourne
    facilities become not_available, which populates the middle state of the tri-state from real data. If it is an unticked box, they become no published
    information. Resolve by reading the publisher's data dictionary or by contacting helpline@toiletmap.gov.au, and record the answer here. Do not
    decide it by inspection of the data, because both readings fit the distribution.
  - >-
    Confirm whether data.gov.au publishes a metadata last-updated date distinct from the reference period. publisher_last_updated is currently set to the
    reference period end of 12 January 2022, which is the conservative reading and the one that appears on screen beside every confirmed status. The export
    timestamp of 1 August 2026 describes when the file was generated, not the currency of its contents, and must not be substituted for it.
