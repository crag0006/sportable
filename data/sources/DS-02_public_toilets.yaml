source_id: DS-02
name: National Public Toilet Map
publisher: Department of Health, Disability and Ageing
description: >-
  National register of public toilet facilities with accessibility attributes, operated for public benefit and published through data.gov.au. 
  Supplies the accessible toilet link of the access chain, together with the MLAK key requirement and recorded opening hours.

