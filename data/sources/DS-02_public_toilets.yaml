coverage:
  publisher_scope: national
  records_total: 25449
  records_in_target_area: null
  basis: >-
    25449 rows nationally in the 1 August 2026 export, of which 6059 are in Victoria. A provisional bounding-box filter over the City of Melbourne
    returns 247 facilities, but the definitive figure must be counted against the DS-07 boundary polygon, not a rectangle, so records_in_target_area stays
    null until DS-07 is loaded.
  notes: >-
    Facility types in the provisional City of Melbourne set are led by park or reserve (77), other (68), shopping centre (26), community building (19) and
    train station (17), so a meaningful share sit at or near sport venues.

