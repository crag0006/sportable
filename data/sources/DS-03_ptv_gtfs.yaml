source_id: DS-03
name: GTFS Schedule
publisher: Department of Transport and Planning
description: >-
  General Transit Feed Specification schedule for the Victorian public transport network, published as one archive containing 
  a separate feed per transport mode. Supplies stop locations and the wheelchair_boarding attribute, which is
  the step-free stop link of the access chain. Iteration 1 uses metropolitan train and metropolitan tram only.

tier: transit
cadence: weekly

licence:
  name: Creative Commons Attribution
  version: 4.0 International
  url: https://creativecommons.org/licenses/by/4.0/
  attribution_text: >-
    GTFS Schedule, Department of Transport and Planning, State Government of Victoria, via Victorian Government Open Data.
  share_alike: false
  restricts_caching: false
  restricts_redistribution: false
  restricts_derived_works: false
  notes: >-
    No required attribution wording is stated on the dataset page, so the string above is generated from the dataset title and publishing organisation. 
    It is rendered from this register into the Sources and licences view, never hand-written into a template.

retrieval:
  landing_page: https://opendata.transport.vic.gov.au/dataset/gtfs-schedule
  download_url: https://opendata.transport.vic.gov.au/dataset/3f4e292e-7f8a-4ffe-831f-1953be0fe448/resource/fb152201-859f-4882-9206-b768060b50ad/download/gtfs.zip
  format: zip
  raw_prefix: ptv_gtfs
  requires_auth: false
  notes: >-
    Nested archive. gtfs.zip contains numbered directories 1 to 11, one per mode (1 Regional Train, 2 Metropolitan Train, 3 Metropolitan Tram, 4 Myki Bus,
    5 Regional Coach, 6 Regional Bus, 10 Interstate, 11 SkyBus). Each directory holds a google_transit.zip with the standard GTFS text files. 
    Iteration 1 reads directories 2 and 3 only. The Fetch Lambda lands the outer archive unmodified; unpacking and mode selection happen in Transform, 
    never in the raw zone, so a later decision to add bus is a Transform change and not a re-fetch.

coverage:
  publisher_scope: statewide
  records_total: null
  records_in_target_area: null
  basis: >-
    PENDING. Directory 2 (Metropolitan Train) stops.txt has been profiled: 2859 rows statewide, of which 226 are location_type 1 stations, 22 of those
    inside a rough City of Melbourne bounding box. Directory 3 (Metropolitan Tram) has not yet been profiled, and the final counts must be taken against
    the DS-07 boundary rather than a bounding box, so both fields stay null until the grain decision below is settled and both modes are counted.
  notes: >-
    Record the counts at the grain that reaches the facility table, not the raw stops.txt row count, and state which mode directories were read. 
    Adding bus later changes both figures.

