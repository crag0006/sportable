known_limitations:
  - >-
    wheelchair_boarding is three-valued and maps directly onto the product tri-state. 1 is confirmed, 2 is not_available, and 0 or empty is
    no_published_information. Never collapse 0 or empty to a no.
  - >-
    The field confirms almost everything it touches. In directory 2, 225 of 226 stations carry 1, and only 10 rows in the entire file carry 2. Inside the
    City of Melbourne, all 22 stations carry 1. The filter is therefore weakly discriminating for rail, and the interface must not imply it is narrowing
    results when it is not.
  - >-
    stops.txt mixes four row kinds under location_type: 1 station, 2 entrance or exit, 3 generic node, and blank or 0 platform. Directory 2 holds 226, 
    746, 1112 and 775 of each. Loading every row as a facility would stack four step_free_stop points on one station and inflate every match rate.
  - >-
    location_type 3 rows carry no wheelchair_boarding value at all. All 1112 are blank, so they can only ever be no_published_information.
  - >-
    A stop recorded as step free says nothing about whether the service calling at it is accessible, nor about the path between the stop and the venue. 
    The corridor query measures proximity; it does not verify a traversable route.
  - >-
    Tram accessibility is recorded at the stop, and the feed does not distinguish a raised platform stop from a kerbside stop with no platform. These are
    materially different situations for a wheelchair user and the source cannot tell them apart.
  - >-
    The archive contains pathways.txt and levels.txt. Both were assessed and both are out of Iteration 1 scope. levels.txt is a seven-row global floor
    index from Level -4 to Level 2 with every level_name blank; it carries no accessibility attribute. pathways.txt is a genuine station topology graph,
    3850 edges across 224 stations, distinguishing walkway (2794), stairs (454), elevator (299), escalator (120), fare gate (106) and exit gate (77).
  - >-
    pathways.txt cannot support a step-free entry claim, and this was tested rather than assumed. The GTFS optional columns that would describe a walkway
    as level (max_slope, min_width, stair_count) are absent from this feed, so pathway_mode 1 means walkway, not step-free walkway. Building the graph,
    keeping only the modes a wheelchair user can traverse, and testing entrance to platform reachability returns a step-free path at 24 of 24 City of
    Melbourne stations. It discriminates no better than wheelchair_boarding, which confirms 22 of 22. Richmond passes with zero elevators and twelve
    stairs edges, because its platforms carry parallel walkway and stairs connections and nothing in the feed distinguishes a level walkway from a
    ramp. The known-limitation register's statement that step-free entry is not published therefore stands for railway stations as a tested finding, 
    not an assumption.

open_questions:
  - >-
    BLOCKING. Decide which location_type values become facility rows, per mode. For rail, location_type 1 is the natural grain because a station is 
    the place a person arrives at. Trams have no station structure, so directory 3 needs its own decision. Record the choice in the column 
    contract and report the resulting facility count, because the grain determines every step_free_stop match rate in the quality report.
  - >-
    Profile directory 3 stops.txt and fill records_total and records_in_target_area for both modes combined.
