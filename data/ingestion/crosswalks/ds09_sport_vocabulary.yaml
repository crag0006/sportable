    publisher_term_id: 1319
    activity_count: 1
    relation: added_adaptive
    maps_to:
      - "Adaptive climbing"
    note: >-
      NOT Rock Climbing and NOT Bouldering. Adaptive climbing is climbing re-engineered around the climber: hauling
      systems, seated ascenders, trained belayers. Folding it into a climbing gym's listing would tell a wheelchair
      user that any bouldering wall will do, which is the exact error this crosswalk exists to prevent. It enters
      the vocabulary as its own sport.

