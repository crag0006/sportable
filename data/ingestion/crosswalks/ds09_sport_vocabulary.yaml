# ============================================================================
# ds09_sport_vocabulary.yaml — AAA Play activity_type to the venue sport vocabulary
#
# WHAT THIS IS
#     One reviewed row per AAA Play activity_type term, saying which sport or
#     sports in the venue vocabulary it means. program_sport.sport_key holds the
#     publisher's own term; this file is what turns that term into something a
#     venue sport search can match, and what records the terms that deliberately
#     do not match anything.
#
# WHY A FILE AND NOT A REGEX
#     Every shortcut that suggests itself here is wrong on real data.
#     Lower-casing and comparing misses "Calisthenics" against "Callisthenics".
#     Prefix matching maps "Gym" onto "Gymnastics". Fuzzy matching maps "Boccia"
#     onto "Bocce", which are different games, and onto "Bowls", which is a
#     different game again. A regex would do all three silently and nobody would
#     find out until a wheelchair user was sent to a bowling green. The mapping
#     was generated once against the live taxonomy, then read line by line, and
#     the reading is what this file records.
#
# WHAT IT COMPLEMENTS
#     backend/app/repositories/postgres.py carries a SPORT_ALIASES dict of seven
#     entries, applied in SQL at query time. Every one of those seven is
#     reproduced here and marked, so the two cannot disagree. This file goes
#     further in the one way that matters: SPORT_ALIASES is one-to-one, so it
#     cannot express "Bike riding, BMX & cycling" meaning BOTH Cycling and BMX,
#     and it cannot express "Tennis" meaning both of the vocabulary's two tennis
#     entries. Those are the misses it is silently making today. Migration
#     012_sport_crosswalk.sql loads this file's rows into a table so the join is
#     many-to-many and a search for either sport finds the programme.
#
# THE JUDGEMENT CALL THIS FILE EXISTS FOR
#     ADAPTIVE AND PARA SPORTS ARE NEVER FOLDED INTO THEIR NON-ADAPTIVE PARENTS.
#     Boccia is not Bowls. Adaptive climbing is not Bouldering. Walking and
#     rolling is not walking. Floor curling has no parent in the register at all.
#     Goalball is not an indoor ball sport with a smaller court. On a product
#     built for wheelchair users, collapsing an adaptive sport into the sport it
#     was adapted from is not tidying a vocabulary, it is deleting the reason the
#     programme exists and sending somebody to a venue that cannot host them.
#     Those terms are ADDED to the vocabulary as sports in their own right, with
#     relation added_adaptive, and they carry no row to a parent. If a later
#     change proposes mapping one of them onto a parent to make a search result
#     tidier, that change is wrong.
#
# HTML ENTITIES
#     Two terms arrive HTML-encoded from the WordPress API, "Bike riding, BMX
#     &amp; cycling" and "Billiards, snooker &amp; pool". `term` below holds the
#     DECODED text, because the transformer decodes once at transform time
#     through _text() and the entity must never reach a screen or a key. Do not
#     re-add the entity to this file to make it match a raw API response.
#
# RELATIONS
#     exact           Same sport, same wording as the venue vocabulary.
#     alias           Same sport, different wording.
#     narrower        A more specific form of a broader vocabulary sport whose
#                     venues genuinely host it. Used only where the broader entry
#                     is a real parent, never where it is a sibling.
#     compound        One publisher label naming several vocabulary sports.
#     split           One publisher term covering several vocabulary entries that
#                     the vocabulary distinguishes and the publisher does not.
#     added           A real sport the venue vocabulary does not contain. Enters
#                     the vocabulary as its own entry rather than being folded
#                     into a sibling.
#     added_adaptive  As added, and deliberately NOT folded into a non-adaptive
#                     parent. See above.
#     not_a_sport     A published term that is not a sport. Kept as published
#                     under its own label, given no vocabulary entry.
#     unmapped        Could not be resolved. No term is in this state today. The
#                     state exists because a term that appears upstream and is
#                     absent from this file is quarantined as SCHEMA_VIOLATION by
#                     the transformer rather than dropped, and the fix is to add
#                     it here with a reviewed relation.
#
# maps_to IS A LIST ON PURPOSE. Several terms carry more than one entry and an
# empty list is a decision, not a gap; see relation and note on each row.
#
# venue_vocabulary BELOW is the distinct Sports Played values from the DS-01
# workbook of 17 December 2024, case-folded to one spelling each. It is carried
# in this file so the crosswalk can be checked against the vocabulary it targets
# without a database and without the 3.6 MB workbook, which is not committed.
# It is a snapshot for review, NOT the runtime vocabulary: the runtime list is
# the sport_vocabulary materialised view, which holds only the sports of venues
# actually loaded.
#
# HOW TO CHANGE IT
#     Add or edit the row, run `uv run pytest tests/test_ds09_sport_crosswalk.py`
#     in data/, and update 012_sport_crosswalk.sql so the seeded rows still
#     match. The test compares the two and fails if they drift.
# ============================================================================

crosswalk_id: CW-01
title: AAA Play activity_type to the venue sport vocabulary
source_id: DS-09
target: venue_sport.sport, surfaced as the sport_vocabulary materialised view
target_source_id: DS-01
publisher_taxonomy: activity_type
publisher_taxonomy_terms: 82

reviewed:
  generated_from: >-
    Live pull of https://www.aaaplay.org.au/wp-json/wp/v2/activity_type?per_page=100, 15 September 2026, all 82 terms, with term
    id, slug and activity count as published.
  vocabulary_from: >-
    Distinct Sports Played values in sheet wholeIFMD of the DS-01 workbook published 17 December 2024, 84 raw values reducing to
    80 after case-folding four duplicate spellings.
  reviewed_on: 2026-09-15
  method: >-
    Generated once by joining the two lists, then read term by term and decided by hand. Every relation other than exact was
    written with a reason, and the reasons are in the file rather than in a commit message because the next person to touch this
    will be reading the file.

