[project]
name = "sportable-assistant-lab"
version = "0.0.1"
description = "Local test bench for the SportAble assistant: tools over the running API, a local Qwen model, optional pgvector retrieval. Not part of the repository."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "anthropic>=0.60",
    "markdown>=3.7",
]

[tool.uv]
package = false
